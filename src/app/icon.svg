<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Casa Colina">
  <!--
    Sea, hill, sun — the three things the brand line promises ("море и горы
    в одном дне"). Deliberately only three shapes: at 16px in a browser tab a
    literal little house turns to mush, but a bold silhouette still reads.
    Terracotta ground + cream marks, straight from the site palette.
  -->
  <defs>
    <clipPath id="cc-round">
      <rect width="64" height="64" rx="15" />
    </clipPath>
  </defs>

  <g clip-path="url(#cc-round)">
    <rect width="64" height="64" fill="#c2562c" />

    <!-- sun -->
    <circle cx="43.5" cy="21" r="7" fill="#faf4e8" />

    <!-- the sea line, just under the horizon -->
    <rect x="0" y="41.5" width="64" height="3" fill="#faf4e8" opacity="0.5" />

    <!-- the hill -->
    <path
      d="M0 64 V50.5 C9 50.5 15.5 25 26 25 C36 25 42.5 46 52.5 46 C58 46 61 47.5 64 47.5 V64 Z"
      fill="#faf4e8"
    />
  </g>
</svg>
